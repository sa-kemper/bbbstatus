version: '3.8'

services:
  bbbstatus:
    image: bbbstatus:latest
    container_name: bbbstatus
    environment:
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://bbbstatus:bbbstatus@db:5432/bbbstatus}
      - HOST=0.0.0.0
      - PORT=8080
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - proxy-network

  db:
    image: postgres:15
    container_name: bbbstatus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbbstatus}
      POSTGRES_USER: ${POSTGRES_USER:-bbbstatus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbbstatus}
    volumes:
      - ${DATABASE_DIRECTORY:-.}/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - proxy-network

  caddy:
    image: caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
