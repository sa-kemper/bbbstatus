version: '3.8'
services:
  db:
    image: postgres:15
    container_name: bbbstatus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbbstatus}
      POSTGRES_USER: ${POSTGRES_USER:-bbbstatus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ${DATABASE_DIRECTORY:-.}/data:/var/lib/postgresql/data
    restart: unless-stopped

  bbbstatus:
    image: mydockerapp
    container_name: bbbstatus
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://bbbstatus_user:securepassword@db:5432/bbbstatus}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${APP_PORT:-8080}
    depends_on:
      - db
    restart: unless-stopped
