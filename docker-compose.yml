name: bbbstatus
services:
  bbbstatus:
    image: bbbstatus:latest
    container_name: bbbstatus
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-postgresql://bbbstatus:bbbstatus@db:5432/bbbstatus}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${APP_PORT:-8080}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/8,172.17.0.1/16,::1/128}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - proxy-network

  db:
    image: postgres:15
    container_name: bbbstatus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bbbstatus}
      POSTGRES_USER: ${POSTGRES_USER:-bbbstatus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bbbstatus}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ${DATABASE_DIRECTORY:-.}/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - proxy-network

  caddy:
    image: caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - proxy-network

networks:
  proxy-network:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config: