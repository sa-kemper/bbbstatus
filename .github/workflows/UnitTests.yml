name: "CI"
on: [ "push", "pull_request" ]

jobs:
  ci:
    name: "Run CI"
    strategy:
      fail-fast: false
      matrix:
        os: [ "windows-latest", "ubuntu-latest", "macOS-latest" ]
        go: [ "1.26.x" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v1
        with:
          fetch-depth: 1
      - uses: WillAbides/setup-go-faster@v1.15.0
        with:
          go-version: ${{ matrix.go }}
      - run: "go test -v ./..."
      - run: "go vet ./..."